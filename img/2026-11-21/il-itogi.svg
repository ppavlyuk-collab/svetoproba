" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 138)">а не за количество прожекторов</text><text x="110" y="256" font-size="50" text-anchor="middle" fill="currentColor" transform="rotate(0.0 110 256)">2</text><text x="190" y="234" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 234)">Обслуживание входит в задание проекта</text><text x="190" y="278" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 278)">наравне с освещённостью</text><text x="110" y="396" font-size="50" text-anchor="middle" fill="currentColor" transform="rotate(0.0 110 396)">3</text><text x="190" y="374" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 374)">Ремонт и сменный модуль продлевают</text><text x="190" y="418" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 418)">жизнь установки</text><text x="110" y="536" font-size="50" text-anchor="middle" fill="currentColor" transform="rotate(0.0 110 536)">4</text><text x="190" y="514" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 514)">Темнота тоже ценность места</text><text x="190" y="558" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 558)">и условие проекта</text><text x="110" y="676" font-size="50" text-anchor="middle" fill="currentColor" transform="rotate(0.0 110 676)">5</text><text x="190" y="654" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 654)">Концепцию покупают вместе</text><text x="190" y="698" font-size="38" text-anchor="start" fill="currentColor" transform="rotate(0.0 190 698)">с сопровождением реализации</text></g></svg>