entColor" transform="rotate(0.0 330 895)">свет, рассеянный каплями, доходит до глаза</text><text x="1060" y="925" font-size="30" text-anchor="end" fill="currentColor" transform="rotate(0.0 1060 925)">светящийся слой перед стеной даёт фасаду глубину</text></g></svg>