4 520 686)">в кромке порога</text><text x="70" y="640" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(1.2 70 640)">зритель у порога:</text><text x="70" y="676" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(1.0 70 676)">угла и края пола</text><text x="70" y="712" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(-1.3 70 712)">в поле зрения нет</text><text x="410" y="96" font-size="30" text-anchor="middle" fill="currentColor" transform="rotate(-0.6 410 96)">стена без швов</text><text x="100" y="330" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(-0.6 100 330)">скруглённый</text><text x="100" y="365" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(1.0 100 365)">угол: линии</text><text x="100" y="400" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(0.9 100 400)">стыка нет</text><text x="300" y="300" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(0.5 300 300)">однородный цвет</text><text x="300" y="335" font-size="30" text-anchor="start" fill="currentColor" transform="rotate(2.3 300 335)">на всей стене</text><text x="840" y="60" font-size="36" text-anchor="start" fill="currentColor" transform="rotate(-2.4 840 60)">Что видит зритель</text><text x="1000" y="355" font-size="30" text-anchor="middle" fill="currentColor" transform="rotate(-1.5 1000 355)">обычная комната:</text><text x="1000" y="390" font-size="30" text-anchor="middle" fill="currentColor" transform="rotate(2.3 1000 390)">углы и рёбра дают глубину</text><text x="990" y="695" font-size="26" text-anchor="middle" fill="currentColor" transform="rotate(-1.0 990 695)">Ganzfeld: ни линий, ни контуров,</text><text x="990" y="730" font-size="26" text-anchor="middle" fill="currentColor" transform="rotate(1.1 990 730)">расстояние до стены не читается</text></g></svg>