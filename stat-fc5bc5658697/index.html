<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Читатели</title><style>
body{background:#f1ead9;color:#1d1b16;font:17px/1.45 Georgia,serif;margin:0;padding:24px 16px}main{max-width:640px;margin:auto}h1{font-size:30px;margin:0 0 4px}h2{font-size:22px;margin:32px 0 8px}
.n{display:flex;gap:32px;flex-wrap:wrap}.n b{display:block;font-size:40px;line-height:1.1}table{border-collapse:collapse;width:100%;margin-top:14px}td{padding:4px 0;vertical-align:top}td:last-child{text-align:right;font-weight:bold;padding-left:16px}p{color:#6b6556;font-size:14px}</style></head><body><main><h1>Читатели</h1><p>Один браузер считается один раз. Веб: открыли номер. Полоса: простояла посреди экрана от 5 секунд. PDF: нажали кнопку на сайте или ссылку /pdf/ из поста. Счёт идёт с 07.11.2026.</p><div id="o">Считаю…</div></main><script>
var D={"2026-10-31": {"no": 1, "pages": [{"id": "p1", "t": "Тема номера: премии и фестивали"}, {"id": "p2", "t": "Россия и города"}, {"id": "p3", "t": "Свет и наука"}, {"id": "p4", "t": "Проекты"}, {"id": "p5", "t": "Новинки производителей"}, {"id": "p6", "t": "Нормы и инструменты"}, {"id": "p7", "t": "Мастера"}, {"id": "p8", "t": "Обзор прессы"}, {"id": "p9", "t": "Книги"}]}, "2026-11-07": {"no": 2, "pages": [{"id": "p1", "t": "Тема номера: свет и наследие"}, {"id": "p2", "t": "Россия: памятник и город"}, {"id": "p3", "t": "Отрасль: люди и события"}, {"id": "p4", "t": "Ночное освещение: мера и последствия"}, {"id": "p5", "t": "Город"}, {"id": "p6", "t": "Новинки и инструменты"}, {"id": "p7", "t": "Мастера"}, {"id": "p8", "t": "Что читать"}]}},B="https://abacus.jasoncameron.dev/get/svetoproba-weekly/";
function g(k){return fetch(B+k).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){return j.value||0}).catch(function(){return "?"})}
var ds=Object.keys(D).sort().reverse();Promise.all(ds.map(function(d){var P=D[d].pages;return Promise.all([g("web."+d),g("pdf."+d)].concat(P.map(function(x){return g("page."+d+"."+x.id)}))).then(function(v){
var h="<h2>№ "+D[d].no+", "+d.split("-").reverse().join(".")+"</h2><div class=n><div><b>"+v[0]+"</b>веб-версия</div><div><b>"+v[1]+"</b>PDF</div></div><table>";
P.forEach(function(x,i){h+="<tr><td>"+x.t.replace(/</g,"&lt;")+"</td><td>"+v[i+2]+"</td></tr>"});return h+"</table>"})})).then(function(a){document.getElementById("o").innerHTML=a.join("")});
</script></body></html>
