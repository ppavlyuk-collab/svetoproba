а хуже регулируются,</text><text x="600" y="960" font-size="48" text-anchor="middle" fill="currentColor" transform="rotate(0.0 600 960)">ночная очистка мозга слабее,</text><text x="600" y="1020" font-size="48" text-anchor="middle" fill="currentColor" transform="rotate(0.0 600 1020)">суточный ритм сбивается</text></g></svg>